---
- name: Update apt cache
  ansible.builtin.apt:
    lock_timeout: 300
    update_cache: true
    cache_valid_time: 3600

- name: Install common utilities and unattended security upgrades
  ansible.builtin.apt:
    lock_timeout: 300
    name:
      - curl
      - git
      - htop
      - xz-utils
      - unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
