---
# Local PostgreSQL for the cheap dev profile. It listens on loopback only (Ubuntu's default),
# so there is no network exposure and no pg_hba changes are needed.
- name: Install PostgreSQL and the Python driver Ansible needs
  ansible.builtin.apt:
    lock_timeout: 300
    name:
      - postgresql
      - python3-psycopg2
      - acl # lets Ansible become the unprivileged postgres user
    state: present

- name: Start and enable PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create the application database role
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    encrypted: true
    role_attr_flags: CREATEDB
    state: present
  no_log: true
