[defaults]
inventory = inventory/aws_ec2.yml
enable_plugins = amazon.aws.aws_ec2
vault_password_file = .vault_pass
host_key_checking = False
remote_user = ubuntu
private_key_file = ~/.ssh/demo-key.pem

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
