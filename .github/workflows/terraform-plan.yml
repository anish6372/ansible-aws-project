name: Terraform plan and cost

# Runs on PRs that touch infrastructure. Authenticates to AWS through GitHub OIDC (no stored keys).
# The role is read-only, so CI can plan but never change infrastructure; apply is a deliberate local step.
# Requires repository variables: AWS_ROLE_ARN, TF_STATE_BUCKET (from `terraform -chdir=terraform/bootstrap output`).

on:
  pull_request:
    paths: ["terraform/**", "app/**", "roles/**", "local.yml", ".github/workflows/terraform-plan.yml"]

permissions:
  id-token: write      # OIDC token
  contents: read
  pull-requests: write # post plan and cost comments

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    if: vars.AWS_ROLE_ARN != ''
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Init
        working-directory: terraform/envs/${{ matrix.env }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=multitier/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"

      - name: Plan
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          TF_ENV: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            const plan = fs.readFileSync(`terraform/envs/${env}/plan.txt`, 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan (${env})\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`,
            });

  cost:
    name: Infracost estimate
    runs-on: ubuntu-latest
    if: vars.INFRACOST_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Estimate cost of the dev (single server) profile
        run: infracost breakdown --path terraform/envs/dev --format json --out-file /tmp/infracost-dev.json
      - name: Estimate cost of the prod-like profile (ALB + ASG + RDS)
        run: infracost breakdown --path terraform/envs/prod --format json --out-file /tmp/infracost-prod.json
      - name: Comment on PR
        run: |
          infracost comment github --path "/tmp/infracost-*.json" \
            --repo $GITHUB_REPOSITORY --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pull-request ${{ github.event.pull_request.number }} --behavior update
