name: CI/CD — Lint and Deploy

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint-action@v6
        with:
          targets: |
            site.yml
            roles/

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: lint                      # only deploy if lint passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and AWS dependencies
        run: |
          pip install ansible boto3 botocore

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install amazon.aws community.postgresql community.general

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/demo-key.pem
          chmod 600 ~/.ssh/demo-key.pem

      - name: Write Ansible Vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Ansible playbook
        run: ansible-playbook site.yml

      - name: Clean up secrets
        if: always()
        run: |
          rm -f ~/.ssh/demo-key.pem .vault_pass
