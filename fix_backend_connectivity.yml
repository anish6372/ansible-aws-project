---
- name: Debug and Fix Backend Connectivity Issues
  hosts: localhost
  gather_facts: no
  vars:
    check_mode: false  # Set to true for dry-run
  
  tasks:
    - name: Get current infrastructure IPs from Terraform
      block:
        - name: Get web server IP
          shell: cd terraform && terraform output -raw web_instance_public_ip
          register: web_ip_result
          
        - name: Get app server IP  
          shell: cd terraform && terraform output -raw app_instance_public_ip
          register: app_ip_result
          
        - name: Get database server IP
          shell: cd terraform && terraform output -raw db_instance_public_ip  
          register: db_ip_result
          
        - name: Display current infrastructure IPs
          debug:
            msg:
              - "Web Server IP: {{ web_ip_result.stdout }}"
              - "App Server IP: {{ app_ip_result.stdout }}"  
              - "Database Server IP: {{ db_ip_result.stdout }}"

    - name: Update hard-coded IPs in webserver role
      replace:
        path: roles/webserver/tasks/main.yml
        regexp: 'backend_ip: ".*"'
        replace: 'backend_ip: "{{ app_ip_result.stdout }}"'
      when: not check_mode

    - name: Update hard-coded IPs in backend role  
      replace:
        path: roles/backend/tasks/main.yml
        regexp: 'db_ip: ".*"'
        replace: 'db_ip: "{{ db_ip_result.stdout }}"'
      when: not check_mode
        
    - name: Show what would be updated (check mode)
      debug:
        msg:
          - "Would update webserver backend_ip to: {{ app_ip_result.stdout }}"
          - "Would update backend db_ip to: {{ db_ip_result.stdout }}"
      when: check_mode

- name: Test and fix backend service on app server
  hosts: tag_Role_backend
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check if backend service exists
      systemd:
        name: backend
      register: backend_service_check
      ignore_errors: yes
      
    - name: Display backend service status
      debug:
        msg: "Backend service status: {{ backend_service_check }}"
        
    - name: Check if Node.js backend process is running
      shell: "pgrep -f 'node.*server.js' || echo 'not_running'"
      register: node_process_check
      
    - name: Display Node.js process status  
      debug:
        msg: "Node.js backend process: {{ node_process_check.stdout }}"
        
    - name: Check backend service logs
      shell: "journalctl -u backend --no-pager -n 20"
      register: backend_logs
      ignore_errors: yes
      
    - name: Display backend logs
      debug:
        msg: "{{ backend_logs.stdout_lines }}"
      when: backend_logs.stdout_lines is defined
        
    - name: Restart backend service if it exists
      systemd:
        name: backend
        state: restarted
        enabled: yes
      when: backend_service_check is succeeded
      
- name: Test and fix nginx configuration on web server  
  hosts: tag_Role_webserver
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check nginx status
      systemd:
        name: nginx
      register: nginx_status
      
    - name: Display nginx status
      debug: 
        msg: "Nginx status: {{ nginx_status }}"
        
    - name: Check nginx configuration syntax
      shell: "nginx -t"
      register: nginx_config_test
      ignore_errors: yes
      
    - name: Display nginx config test results
      debug:
        msg: "{{ nginx_config_test.stderr_lines }}"
        
    - name: Check nginx error logs
      shell: "tail -20 /var/log/nginx/error.log"
      register: nginx_error_logs
      ignore_errors: yes
      
    - name: Display nginx error logs
      debug:
        msg: "{{ nginx_error_logs.stdout_lines }}"
      when: nginx_error_logs.stdout_lines is defined
        
    - name: Test backend connectivity from web server
      uri:
        url: "http://{{ hostvars[groups['tag_Role_backend'][0]]['ansible_host'] }}:3000/api/status"
        method: GET
        timeout: 10
      register: backend_connectivity_test
      ignore_errors: yes
      when: groups['tag_Role_backend'] is defined and groups['tag_Role_backend'] | length > 0
      
    - name: Display backend connectivity test result
      debug:
        msg: 
          - "Backend connectivity test: {{ 'SUCCESS' if backend_connectivity_test.status == 200 else 'FAILED' }}"
          - "Response: {{ backend_connectivity_test.json if backend_connectivity_test.json is defined else 'No JSON response' }}"
      when: backend_connectivity_test is defined
      
    - name: Restart nginx if config is valid
      systemd:
        name: nginx  
        state: restarted
      when: nginx_config_test.rc == 0

- name: Final connectivity test
  hosts: localhost
  gather_facts: no
  
  tasks:
    - name: Test public access to web server API
      uri:
        url: "http://{{ hostvars[groups['tag_Role_webserver'][0]]['ansible_host'] }}/api/status" 
        method: GET
        timeout: 15
      register: public_api_test
      ignore_errors: yes
      when: groups['tag_Role_webserver'] is defined and groups['tag_Role_webserver'] | length > 0
      
    - name: Display final test results
      debug:
        msg:
          - "=== FINAL CONNECTIVITY TEST ==="
          - "URL tested: http://{{ hostvars[groups['tag_Role_webserver'][0]]['ansible_host'] }}/api/status"
          - "Status: {{ 'SUCCESS' if public_api_test.status == 200 else 'FAILED' }}"  
          - "Response: {{ public_api_test.json if public_api_test.json is defined else public_api_test.content if public_api_test.content is defined else 'No response' }}"
      when: public_api_test is defined